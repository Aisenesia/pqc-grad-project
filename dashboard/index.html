<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Interceptor Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --border-color: #334155;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
            display: inline-block;
        }

        .status-indicator.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--border-color);
        }

        #log-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .log-entry {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid transparent;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.type-event { border-left-color: var(--text-secondary); }
        .log-entry.type-pubkey { border-left-color: var(--accent-purple); }
        .log-entry.type-msg { border-left-color: var(--accent-blue); }

        .entry-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .entry-type {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.1);
        }

        .entry-content {
            font-family: var(--font-mono);
            word-break: break-all;
            line-height: 1.5;
        }

        .hex-block {
            background-color: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        .label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 2px;
            display: block;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 50px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <span id="status" class="status-indicator"></span>
            Interceptor Dashboard
        </h1>
        <div class="controls">
            <button onclick="clearLog()">Clear Log</button>
            <button onclick="toggleAutoScroll()" id="scrollBtn">Auto-scroll: ON</button>
        </div>
    </header>

    <div id="log-container">
        <div class="empty-state">Waiting for traffic...</div>
    </div>

    <script>
        const wsUrl = 'ws://127.0.0.1:8080';
        let ws;
        let autoScroll = true;
        const logContainer = document.getElementById('log-container');
        const statusIndicator = document.getElementById('status');
        const emptyState = document.querySelector('.empty-state');

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusIndicator.classList.add('connected');
                addSystemLog('Connected to Interceptor Server');
            };

            ws.onclose = () => {
                statusIndicator.classList.remove('connected');
                addSystemLog('Disconnected from server. Reconnecting in 3s...');
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Failed to parse message:', event.data);
                }
            };
        }

        function handleMessage(data) {
            if (emptyState) emptyState.style.display = 'none';

            const div = document.createElement('div');
            div.className = `log-entry type-${data.type.toLowerCase()}`;
            
            const timestamp = new Date().toLocaleTimeString();
            
            let contentHtml = '';

            if (data.type === 'EVENT') {
                contentHtml = `<div class="entry-content">${escapeHtml(data.message)}</div>`;
            } else if (data.type === 'PUBKEY') {
                contentHtml = `
                    <div class="entry-content">
                        <div><strong>Source:</strong> ${escapeHtml(data.from)}</div>
                        <span class="label">Public Key Packet (Hex):</span>
                        <div class="hex-block">${formatHex(data.hex)}</div>
                    </div>
                `;
            } else if (data.type === 'MSG') {
                // Try to parse IV and Ciphertext if possible (first 16 bytes IV)
                const iv = data.hex.substring(0, 32);
                const ciphertext = data.hex.substring(32);
                
                contentHtml = `
                    <div class="entry-content">
                        <div><strong>Source:</strong> ${escapeHtml(data.from)}</div>
                        <span class="label">IV (Hex):</span>
                        <div class="hex-block" style="color: var(--accent-blue)">${formatHex(iv)}</div>
                        <span class="label">Ciphertext (Hex):</span>
                        <div class="hex-block">${formatHex(ciphertext)}</div>
                        <span class="label">Raw UTF-8 (Attempt):</span>
                        <div style="color: var(--text-secondary); font-size: 0.8rem;">${tryDecodeUtf8(data.hex)}</div>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="entry-header">
                    <span class="entry-type">${data.type}</span>
                    <span>${timestamp}</span>
                </div>
                ${contentHtml}
            `;

            logContainer.appendChild(div);

            if (autoScroll) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        function addSystemLog(msg) {
            const div = document.createElement('div');
            div.className = 'log-entry type-event';
            div.style.opacity = '0.7';
            div.innerHTML = `
                <div class="entry-header">
                    <span class="entry-type">SYSTEM</span>
                    <span>${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="entry-content">${msg}</div>
            `;
            logContainer.appendChild(div);
        }

        function formatHex(hex) {
            // Add spaces every 2 chars for readability
            return hex.match(/.{1,2}/g).join(' ');
        }

        function tryDecodeUtf8(hex) {
            // This will mostly show garbage for encrypted data, but fulfills the user request to "show values"
            let str = '';
            for (let i = 0; i < hex.length; i += 2) {
                str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
            }
            // Escape non-printable
            return str.replace(/[\u0000-\u001F\u007F-\u009F]/g, '.');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLog() {
            logContainer.innerHTML = '';
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('scrollBtn').textContent = `Auto-scroll: ${autoScroll ? 'ON' : 'OFF'}`;
        }

        // Start connection
        connect();
    </script>
</body>
</html>
