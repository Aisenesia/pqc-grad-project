<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Network Visualizer</title>
    <style>
        :root {
            --bg-dark: #0a0e27;
            --bg-card: #1a1f3a;
            --text-primary: #e8edf5;
            --text-secondary: #8892b0;
            --accent-ecc: #00d4ff;
            --accent-kyber: #b968ff;
            --accent-green: #00ff88;
            --accent-red: #ff4757;
            --accent-yellow: #ffd93d;
            --border: #2d3561;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
        }

        #container {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            grid-template-rows: auto 1fr 250px;
            height: 100vh;
            gap: 15px;
            padding: 15px;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .panel {
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }

        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #clients-panel {
            grid-row: 2;
        }

        #visualization {
            grid-row: 2;
            grid-column: 2;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #151b3d 100%);
        }

        #events-panel {
            grid-row: 2;
            grid-column: 3;
        }

        #terminal-panel {
            grid-row: 3;
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            min-height: 0;
        }

        .terminal-window {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .terminal-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px 10px 0 0;
        }

        .terminal-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }
        
        .terminal-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .terminal-select:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .terminal-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--accent-green);
            min-height: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .terminal-output .line {
            margin-bottom: 2px;
        }

        .terminal-output.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .terminal-input-area {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
        }

        .terminal-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .terminal-input:focus {
            outline: none;
            border-color: var(--accent-ecc);
        }

        .terminal-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .terminal-send-btn {
            padding: 6px 16px;
            background: var(--accent-ecc);
            color: var(--bg-dark);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .terminal-send-btn:hover:not(:disabled) {
            background: #00b8e6;
            transform: translateY(-1px);
        }

        .terminal-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .client-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .client-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .client-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .client-mode {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .mode-ecc {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-ecc);
            border: 1px solid var(--accent-ecc);
        }

        .mode-kyber {
            background: rgba(185, 104, 255, 0.2);
            color: var(--accent-kyber);
            border: 1px solid var(--accent-kyber);
        }

        .client-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
        }

        .client-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
        }

        .client-btn {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .client-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .client-btn.danger {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .client-btn.danger:hover {
            background: rgba(255, 71, 87, 0.2);
        }

        .event {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent-green);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-bottom: 4px;
        }

        .event-message {
            color: var(--text-primary);
        }

        .event.type-pubkey {
            border-left-color: var(--accent-ecc);
        }

        .event.type-kyber {
            border-left-color: var(--accent-kyber);
        }

        .event.type-msg {
            border-left-color: var(--accent-green);
        }

        .event.type-error {
            border-left-color: var(--accent-red);
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 5px;
        }

        .badge-ecc {
            background: var(--accent-ecc);
            color: #000;
        }

        .badge-kyber {
            background: var(--accent-kyber);
            color: #000;
        }

        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .control-btn {
            padding: 8px 16px;
            background: var(--accent-ecc);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }

        .control-btn.kyber {
            background: var(--accent-kyber);
        }

        .control-btn.kyber:hover {
            box-shadow: 0 4px 12px rgba(185, 104, 255, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    <path d="M2 12h20"/>
                </svg>
                Crypto Network Visualizer
            </h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="control-btn" onclick="startClient('ECC')" title="Start ECC Client">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="10 8 16 12 10 16 10 8"/>
                    </svg>
                    ECC Client
                </button>
                <button class="control-btn kyber" onclick="startClient('KYBER')" title="Start Kyber Client">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="10 8 16 12 10 16 10 8"/>
                    </svg>
                    Kyber Client
                </button>
                <div class="status">
                    <div class="status-dot"></div>
                    Server Connected
                </div>
            </div>
        </header>

        <div id="clients-panel" class="panel">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Connected Clients (<span id="client-count">0</span>)
            </h2>
            <div id="clients-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                    </svg>
                    <div>No clients connected</div>
                </div>
            </div>
        </div>

        <div id="visualization" class="panel">
            <canvas id="network-canvas"></canvas>
            <div class="legend" style="position: absolute; top: 20px; left: 20px; background: rgba(26, 31, 58, 0.9); padding: 12px; border-radius: 5px; border: 1px solid var(--border);">
                <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;">TRAFFIC LEGEND</div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--accent-ecc);"></div>
                    <span>ECC Key Exchange</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--accent-kyber);"></div>
                    <span>Kyber Key Exchange</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--accent-green);"></div>
                    <span>Encrypted Message</span>
                </div>
            </div>
        </div>

        <div id="events-panel" class="panel">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                Activity Log
            </h2>
            <div id="events-list"></div>
        </div>

        <div id="terminal-panel">
            <!-- Left Terminal -->
            <div class="terminal-window">
                <div class="terminal-header">
                    <div class="terminal-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 17 10 11 4 5"/>
                            <line x1="12" y1="19" x2="20" y2="19"/>
                        </svg>
                        Terminal 1
                    </div>
                    <select class="terminal-select" id="terminal-select-1" onchange="selectTerminal(0, this.value)">
                        <option value="">No client</option>
                    </select>
                </div>
                <div class="terminal-content">
                    <div class="terminal-output empty" id="terminal-output-1">
                        No client selected
                    </div>
                    <div class="terminal-input-area">
                        <input 
                            type="text" 
                            class="terminal-input" 
                            id="terminal-input-1" 
                            placeholder="Type message and press Enter..."
                            disabled
                        />
                        <button class="terminal-send-btn" id="terminal-send-btn-1" disabled>Send</button>
                    </div>
                </div>
            </div>

            <!-- Right Terminal -->
            <div class="terminal-window">
                <div class="terminal-header">
                    <div class="terminal-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 17 10 11 4 5"/>
                            <line x1="12" y1="19" x2="20" y2="19"/>
                        </svg>
                        Terminal 2
                    </div>
                    <select class="terminal-select" id="terminal-select-2" onchange="selectTerminal(1, this.value)">
                        <option value="">No client</option>
                    </select>
                </div>
                <div class="terminal-content">
                    <div class="terminal-output empty" id="terminal-output-2">
                        No client selected
                    </div>
                    <div class="terminal-input-area">
                        <input 
                            type="text" 
                            class="terminal-input" 
                            id="terminal-input-2" 
                            placeholder="Type message and press Enter..."
                            disabled
                        />
                        <button class="terminal-send-btn" id="terminal-send-btn-2" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        const ws = new WebSocket('ws://127.0.0.1:8080');
        
        // Canvas setup
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Server node class (stationary, in center)
        class ServerNode {
            constructor() {
                this.name = 'Server';
                this.x = 0;
                this.y = 0;
                this.radius = 50;
                this.color = '#ffd93d';
                this.pulsePhase = 0;
            }
            
            updatePosition(canvasWidth, canvasHeight) {
                this.x = canvasWidth / 2;
                this.y = canvasHeight / 2;
            }
            
            draw(ctx) {
                // Pulsing glow effect
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                ctx.shadowBlur = 25 * pulse;
                ctx.shadowColor = this.color;
                
                // Outer circle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + '20';
                ctx.fill();
                
                // Middle circle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 12, 0, Math.PI * 2);
                ctx.fillStyle = this.color + '40';
                ctx.fill();
                
                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 25, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                ctx.shadowBlur = 0;
                
                // Label
                ctx.fillStyle = '#0a0e27';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.name, this.x, this.y);
                
                this.pulsePhase += 0.05;
            }
        }
        
        // Client node class
        class ClientNode {
            constructor(name, mode) {
                this.name = name;
                this.mode = mode;
                this.x = Math.random() * (canvas.width - 200) + 100;
                this.y = Math.random() * (canvas.height - 200) + 100;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = 35;
                this.color = mode === 'ECC' ? '#00d4ff' : '#b968ff';
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off edges
                if (this.x < this.radius || this.x > canvas.width - this.radius) {
                    this.vx *= -1;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                }
                if (this.y < this.radius || this.y > canvas.height - this.radius) {
                    this.vy *= -1;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                }
                
                this.pulsePhase += 0.05;
            }
            
            applyRepulsion(otherNodes) {
                // Repel from other nodes to prevent overlap
                const minDistance = this.radius * 1.5; // Minimum distance between nodes
                
                otherNodes.forEach(other => {
                    if (other === this) return;
                    
                    const dx = this.x - other.x;
                    const dy = this.y - other.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < minDistance && distance > 0) {
                        // Calculate repulsion force (much weaker)
                        const force = (minDistance - distance) / minDistance * 0.20;
                        const angle = Math.atan2(dy, dx);
                        
                        // Apply force
                        this.vx += Math.cos(angle) * force;
                        this.vy += Math.sin(angle) * force;
                    }
                });
                
                // Apply damping to reduce velocity over time
                
                
                // Cap velocity
                const maxSpeed = 0.7;
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }
            }
            
            draw(ctx) {
                // Glow effect
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                ctx.shadowBlur = 20 * pulse;
                ctx.shadowColor = this.color;
                
                // Outer circle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + '20';
                ctx.fill();
                
                // Inner circle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 10, 0, Math.PI * 2);
                ctx.fillStyle = this.color + '40';
                ctx.fill();
                
                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 20, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                ctx.shadowBlur = 0;
                
                // Label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.name, this.x, this.y);
            }
        }
        
        // Particle for message/packet animation
        class Particle {
            constructor(fromNode, toNode, color, viaServer = false, delay = 0) {
                this.from = fromNode;
                this.to = toNode;
                this.viaServer = viaServer;
                this.progress = 0;
                this.phase = 0; // 0 = client->server, 1 = server->client
                this.speed = 0.025; // Faster per hop
                this.color = color;
                this.size = 6;
                this.delay = delay;
                this.delayTimer = delay;
            }
            
            update() {
                if (this.delayTimer > 0) {
                    this.delayTimer -= 16; // Assuming 60fps
                    return false;
                }
                
                this.progress += this.speed;
                
                if (this.viaServer && this.progress >= 1 && this.phase === 0) {
                    // Switch to second phase (server -> destination)
                    this.phase = 1;
                    this.progress = 0;
                    return false;
                }
                
                return this.progress >= 1;
            }
            
            draw(ctx) {
                if (this.delayTimer > 0) return;
                
                let startNode, endNode;
                if (this.viaServer) {
                    if (this.phase === 0) {
                        // Phase 0: client -> server
                        startNode = this.from;
                        endNode = serverNode;
                    } else {
                        // Phase 1: server -> client
                        startNode = serverNode;
                        endNode = this.to;
                    }
                } else {
                    startNode = this.from;
                    endNode = this.to;
                }
                
                const x = startNode.x + (endNode.x - startNode.x) * this.progress;
                const y = startNode.y + (endNode.y - startNode.y) * this.progress;
                
                // Enhanced glow effect
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Longer, more visible trail
                const trailLength = 30;
                for (let i = 1; i < trailLength; i++) {
                    const t = Math.max(0, this.progress - i * 0.01);
                    const tx = startNode.x + (endNode.x - startNode.x) * t;
                    const ty = startNode.y + (endNode.y - startNode.y) * t;
                    const alpha = (1 - i / trailLength) * 0.6;
                    
                    ctx.beginPath();
                    ctx.arc(tx, ty, this.size * (1 - i / trailLength * 0.7), 0, Math.PI * 2);
                    ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                    ctx.fill();
                }
            }
        }
        
        // State management (initialized after class definitions)
        const clients = new Map();
        const particles = [];
        const serverNode = new ServerNode();
        let serverConnected = false;
        const clientsWithProcessId = new Map(); // Store client metadata including processId
        let stateSyncReceived = false; // Track if we've received state sync to prevent duplicates
        
        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update server position (in case canvas resized)
            serverNode.updatePosition(canvas.width, canvas.height);
            
            // Only draw server and connections if server is connected
            if (serverConnected) {
                // Draw connections from all clients to server
                const clientArray = Array.from(clients.values());
                ctx.strokeStyle = '#2d3561';
                ctx.lineWidth = 1;
                clientArray.forEach(client => {
                    ctx.beginPath();
                    ctx.moveTo(client.x, client.y);
                    ctx.lineTo(serverNode.x, serverNode.y);
                    ctx.stroke();
                });
                
                // Draw server node (behind particles)
                serverNode.draw(ctx);
            }
            
            // Update and draw clients
            const clientArray = Array.from(clients.values());
            
            // First apply repulsion between all clients
            clientArray.forEach(client => {
                client.applyRepulsion(clientArray);
            });
            
            // Then update positions and draw
            clientArray.forEach(client => {
                client.update();
                client.draw(ctx);
            });
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const done = particles[i].update();
                particles[i].draw(ctx);
                if (done) {
                    particles.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }
        animate();
        
        // WebSocket event handlers
        ws.onopen = () => {
            console.log('Connected to server');
            serverConnected = true;
            addEvent('System', 'Connected to visualization server', 'EVENT');
            
            // Request current server state
            ws.send(JSON.stringify({ command: 'get_state' }));
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            switch(data.type) {
                case 'STATE_SYNC':
                    handleStateSync(data);
                    break;
                case 'EVENT':
                    handleEvent(data);
                    break;
                case 'PUBKEY':
                    handlePublicKey(data);
                    break;
                case 'MSG':
                    handleMessage(data);
                    break;
                case 'KYBER_CAPSULE':
                    handleKyberCapsule(data);
                    break;
                case 'CLIENT_OUTPUT':
                    handleClientOutput(data);
                    break;
                case 'CLIENT_ENDED':
                    handleClientEnded(data);
                    break;
            }
        };
        
        function handleStateSync(data) {
            // Only process state sync once
            if (stateSyncReceived) {
                console.log('Ignoring duplicate state sync');
                return;
            }
            stateSyncReceived = true;
            
            console.log('Received state sync:', data);
            
            // Restore connected TCP clients (network nodes)
            if (data.clients && data.clients.length > 0) {
                data.clients.forEach(client => {
                    if (!clients.has(client.name)) {
                        clients.set(client.name, new ClientNode(client.name, client.mode));
                    }
                    // Store metadata for kill functionality
                    clientsWithProcessId.set(client.name, {
                        id: client.id,
                        processId: client.processId
                    });
                });
                updateClientsList();
                addEvent('System', `Restored ${data.clients.length} connected client(s)`, 'EVENT');
            }
            
            // Restore running client processes (for terminals)
            if (data.processes && data.processes.length > 0) {
                data.processes.forEach(proc => {
                    if (!terminals.has(proc.processId)) {
                        terminals.set(proc.processId, {
                            name: proc.name,
                            mode: proc.mode,
                            lines: [`--- Connected to ${proc.name} (PID: ${proc.pid}) ---`]
                        });
                    }
                });
                updateTerminalDropdowns();
                addEvent('System', `Restored ${data.processes.length} process terminal(s)`, 'EVENT');
            }
        }
        
        function handleEvent(data) {
            // Parse client connection/disconnection
            const msg = data.message;
            
            if (msg.includes('connected') && !msg.includes('disconnected')) {
                // Extract client name (e.g., "Client C1 connected")
                const match = msg.match(/Client .*? connected/);
                if (match) {
                    addEvent('System', msg, 'EVENT');
                }
            } else if (msg.includes('disconnected')) {
                const match = msg.match(/Client (C\d+)/);
                if (match) {
                    const clientName = match[1];
                    clients.delete(clientName);
                    updateClientsList();
                    addEvent('System', msg, 'EVENT');
                }
            }
        }
        
        function handlePublicKey(data) {
            const clientName = data.from;
            const mode = data.mode || 'ECC';
            
            if (!clients.has(clientName)) {
                clients.set(clientName, new ClientNode(clientName, mode));
                updateClientsList();
            }
            
            // Store client metadata for kill functionality
            if (data.clientId !== undefined) {
                clientsWithProcessId.set(clientName, {
                    id: data.clientId,
                    processId: data.processId
                });
                // Update the client list to show/hide kill button
                updateClientsList();
            }
            
            const keyPreview = data.hex.substring(0, 16) + '...';
            addEvent(clientName, `Published ${mode} public key: ${keyPreview}`, 'type-pubkey');
            
            // Create particles to visualize public key distribution through server
            const fromNode = clients.get(clientName);
            if (fromNode) {
                const color = mode === 'ECC' ? '#00d4ff' : '#b968ff';
                let delayOffset = 0;
                
                clients.forEach((toNode, name) => {
                    if (name !== clientName && toNode.mode === fromNode.mode) {
                        // Two-hop routing: client -> server -> other client
                        particles.push(new Particle(fromNode, toNode, color, true, delayOffset));
                        delayOffset += 100; // Stagger arrivals slightly
                    }
                });
            }
        }
        
        function handleMessage(data) {
            const clientName = data.from;
            const msgPreview = data.hex.substring(0, 24) + '...';
            addEvent(clientName, `Sent encrypted message: ${msgPreview}`, 'type-msg');
            
            // Create particles to all other clients through server (green for messages)
            const fromNode = clients.get(clientName);
            if (fromNode) {
                let delayOffset = 0;
                clients.forEach((toNode, name) => {
                    if (name !== clientName && toNode.mode === fromNode.mode) {
                        // Two-hop routing: client -> server -> other client
                        particles.push(new Particle(fromNode, toNode, '#00ff88', true, delayOffset));
                        delayOffset += 100;
                    }
                });
            }
        }
        
        function handleKyberCapsule(data) {
            const clientName = data.from;
            const capsulePreview = data.hex.substring(0, 16) + '...';
            addEvent(clientName, `Sent Kyber encapsulation: ${capsulePreview}`, 'type-kyber');
            
            // Create particle animation through server (purple for Kyber capsules)
            const fromNode = clients.get(clientName);
            if (fromNode) {
                let delayOffset = 0;
                clients.forEach((toNode, name) => {
                    if (name !== clientName && toNode.mode === 'KYBER') {
                        // Two-hop routing: client -> server -> other client
                        particles.push(new Particle(fromNode, toNode, '#b968ff', true, delayOffset));
                        delayOffset += 100;
                    }
                });
            }
        }
        
        function updateClientsList() {
            const clientsList = document.getElementById('clients-list');
            const clientCount = document.getElementById('client-count');
            
            clientCount.textContent = clients.size;
            
            if (clients.size === 0) {
                clientsList.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                        </svg>
                        <div>No clients connected</div>
                    </div>
                `;
                return;
            }
            
            clientsList.innerHTML = '';
            clients.forEach((node, name) => {
                const card = document.createElement('div');
                card.className = 'client-card';
                
                // Check if this client has a process ID (can be killed)
                const clientData = Array.from(clientsWithProcessId.entries()).find(([n, d]) => n === name);
                const hasProcess = clientData && clientData[1].processId !== undefined && clientData[1].processId !== null;
                
                const killButton = hasProcess ? 
                    `<button class="client-btn danger" onclick="killClient(${clientData[1].id})" title="Terminate Process">Kill</button>` : '';
                
                card.innerHTML = `
                    <div class="client-header">
                        <div class="client-name">${name}</div>
                        <div class="client-mode mode-${node.mode.toLowerCase()}">${node.mode}</div>
                    </div>
                    <div class="client-info">
                        Status: Active<br>
                        Connected: Just now
                    </div>
                    ${killButton ? `<div class="client-actions">${killButton}</div>` : ''}
                `;
                clientsList.appendChild(card);
            });
        }
        
        function addEvent(source, message, type) {
            const eventsList = document.getElementById('events-list');
            const event = document.createElement('div');
            event.className = `event ${type}`;
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            
            event.innerHTML = `
                <div class="event-time">${timeStr}</div>
                <div class="event-message"><strong>${source}:</strong> ${message}</div>
            `;
            
            eventsList.insertBefore(event, eventsList.firstChild);
            
            // Keep only last 50 events
            while (eventsList.children.length > 50) {
                eventsList.removeChild(eventsList.lastChild);
            }
        }
        
        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };
        
        ws.onclose = () => {
            console.log('Disconnected from server');
            serverConnected = false;
            document.querySelector('.status-dot').style.background = 'var(--accent-red)';
            document.querySelector('.status').innerHTML = '<div class="status-dot"></div>Server Disconnected';
        };
        
        // Control functions
        function startClient(mode) {
            console.log(`Starting ${mode} client...`);
            
            // Send command via WebSocket
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    command: 'start_client',
                    mode: mode
                }));
                
                addEvent('System', `Launching ${mode} client...`, 'EVENT');
            } else {
                alert('Not connected to server!');
            }
        }
        
        function killClient(clientId) {
            if (!confirm('Are you sure you want to kill this client process?')) {
                return;
            }
            
            console.log(`Killing client ${clientId}...`);
            
            // Send command via WebSocket
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    command: 'kill_client',
                    clientId: clientId
                }));
            } else {
                alert('Not connected to server!');
            }
        }
        
        // Terminal management
        const terminals = new Map(); // processId -> { name, mode, lines }
        const terminalAssignments = [null, null]; // [slot0_processId, slot1_processId]
        
        function handleClientOutput(data) {
            const { processId, output } = data;
            
            // Initialize terminal if not exists
            if (!terminals.has(processId)) {
                const clientInfo = {
                    name: `Client ${processId + 1}`,
                    mode: 'ECC',
                    lines: []
                };
                terminals.set(processId, clientInfo);
                updateTerminalDropdowns();
                
                // Auto-assign to first available slot
                if (terminalAssignments[0] === null) {
                    selectTerminal(0, processId);
                } else if (terminalAssignments[1] === null) {
                    selectTerminal(1, processId);
                }
            }
            
            // Add line to terminal buffer
            const terminal = terminals.get(processId);
            terminal.lines.push(output);
            
            // Keep only last 500 lines
            if (terminal.lines.length > 500) {
                terminal.lines.shift();
            }
            
            // Update display if assigned to a slot
            terminalAssignments.forEach((assignedId, slot) => {
                if (assignedId === processId) {
                    updateTerminalDisplay(slot);
                }
            });
        }
        
        function handleClientEnded(data) {
            const { processId, name } = data;
            if (terminals.has(processId)) {
                const terminal = terminals.get(processId);
                terminal.lines.push(`--- Client ${name} disconnected ---`);
                
                // Update any slot showing this terminal before removal
                terminalAssignments.forEach((assignedId, slot) => {
                    if (assignedId === processId) {
                        updateTerminalDisplay(slot);
                        // Clear the assignment after a brief delay to show the disconnect message
                        setTimeout(() => {
                            terminalAssignments[slot] = null;
                            document.getElementById(`terminal-select-${slot + 1}`).value = '';
                            updateTerminalDisplay(slot);
                        }, 1000);
                    }
                });
                
                // Remove terminal after delay
                setTimeout(() => {
                    terminals.delete(processId);
                    updateTerminalDropdowns();
                }, 1500);
            }
        }
        
        function updateTerminalDropdowns() {
            [1, 2].forEach(slot => {
                const select = document.getElementById(`terminal-select-${slot}`);
                const currentValue = select.value;
                
                select.innerHTML = '<option value="">No client</option>';
                terminals.forEach((terminal, processId) => {
                    const option = document.createElement('option');
                    option.value = processId;
                    option.textContent = terminal.name;
                    select.appendChild(option);
                });
                
                // Restore selection if still valid
                if (currentValue && terminals.has(parseInt(currentValue))) {
                    select.value = currentValue;
                }
            });
        }
        
        function selectTerminal(slot, processId) {
            processId = processId === '' ? null : parseInt(processId);
            terminalAssignments[slot] = processId;
            
            const slotNum = slot + 1;
            const input = document.getElementById(`terminal-input-${slotNum}`);
            const btn = document.getElementById(`terminal-send-btn-${slotNum}`);
            
            if (processId !== null) {
                input.disabled = false;
                btn.disabled = false;
            } else {
                input.disabled = true;
                btn.disabled = true;
            }
            
            updateTerminalDisplay(slot);
        }
        
        function updateTerminalDisplay(slot) {
            const slotNum = slot + 1;
            const outputDiv = document.getElementById(`terminal-output-${slotNum}`);
            const processId = terminalAssignments[slot];
            
            if (processId === null || !terminals.has(processId)) {
                outputDiv.className = 'terminal-output empty';
                outputDiv.innerHTML = 'No client selected';
                return;
            }
            
            const terminal = terminals.get(processId);
            outputDiv.className = 'terminal-output';
            outputDiv.innerHTML = terminal.lines.map(line => 
                `<div class="line">${escapeHtml(line)}</div>`
            ).join('');
            
            // Auto-scroll to bottom
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        function sendToClient(slot) {
            const slotNum = slot + 1;
            const input = document.getElementById(`terminal-input-${slotNum}`);
            const message = input.value.trim();
            const processId = terminalAssignments[slot];
            
            if (message && processId !== null) {
                // Send via WebSocket
                ws.send(JSON.stringify({
                    command: 'send_to_client',
                    processId: processId,
                    message: message
                }));
                
                // Echo to terminal
                const terminal = terminals.get(processId);
                if (terminal) {
                    terminal.lines.push(`> ${message}`);
                    updateTerminalDisplay(slot);
                }
                
                input.value = '';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Terminal input handlers
        document.getElementById('terminal-input-1').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendToClient(0);
        });
        document.getElementById('terminal-send-btn-1').addEventListener('click', () => sendToClient(0));
        
        document.getElementById('terminal-input-2').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendToClient(1);
        });
        document.getElementById('terminal-send-btn-2').addEventListener('click', () => sendToClient(1));
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
